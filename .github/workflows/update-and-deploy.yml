name: Update DART financials and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and analyze DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update.py
      - name: Build dashboard data
        run: python scripts/build_site.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282舫憹actions[bot]@users.noreply.github.com'
          git add data dashboard/data
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'chore: update DART financial data'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
